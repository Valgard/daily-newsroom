[project]
name = "newsroom"
version = "0.1.0"
description = "Local macOS news-digest agent for AI/LLM/ML sources"
readme = "README.md"
authors = [
    { name = "Valgard Trontheim", email = "valgard@trontheim.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.13.0",
    "claude-agent-sdk>=0.1.63",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pydantic>=2.13.2",
    "pync>=2.0.3",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.24.1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-httpx>=0.36.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.11",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR0913"]  # too-many-arguments

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B017"]

[tool.vulture]
paths = ["src/"]
min_confidence = 80
ignore_decorators = ["@app.command", "@*.command", "@app.callback", "@field_validator", "@*.validator"]
ignore_names = ["cls"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "real_llm: tests that hit the real Anthropic API (skipped by default)",
]
addopts = "-m 'not real_llm'"

[project.scripts]
newsroom = "newsroom.cli:app"
