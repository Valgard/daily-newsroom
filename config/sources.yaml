sources:
  # Tier 1: arXiv (daily)
  - name: arxiv-cs-cl
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.CL
    feed_type: rss
    interval_seconds: 86400
    enabled: true
  - name: arxiv-cs-lg
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.LG
    feed_type: rss
    interval_seconds: 86400
    enabled: true
  - name: arxiv-cs-ai
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.AI
    feed_type: rss
    interval_seconds: 86400
    enabled: true

  # Tier 1: Lab blogs
  # Anthropic has no public RSS; we discover articles via their sitemap.xml
  # (1587 entries with real per-article <lastmod>) and scrape og:title/description
  # per new URL. Same strategy for engineering + research subpaths.
  - name: anthropic-news
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/news/[^/]+$'
  - name: anthropic-engineering
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/engineering/[^/]+$'
  - name: anthropic-research
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/research/[^/]+$'
  - name: openai-blog
    category: ai
    subcategory: lab
    url: https://openai.com/news/rss.xml
    feed_type: rss
    interval_seconds: 3600
    enabled: true
  - name: deepmind-blog
    category: ai
    subcategory: lab
    url: https://deepmind.google/blog/rss.xml
    feed_type: rss
    interval_seconds: 3600
    enabled: true
  # Meta AI blog has no RSS, no sitemap (ai.meta.com/sitemap.xml returns 404),
  # and the blog index is a pure JS SPA with no static article links.
  # Scraping would require a headless browser — Phase-1 scope violation.
  - name: meta-ai-blog
    category: ai
    subcategory: lab
    url: https://ai.meta.com/blog/rss/
    feed_type: rss
    interval_seconds: 7200
    enabled: false
  - name: huggingface-blog
    category: ai
    subcategory: lab
    url: https://huggingface.co/blog/feed.xml
    feed_type: rss
    interval_seconds: 7200
    enabled: true

  # Tier 2: Curated
  - name: simon-willison
    category: ai
    subcategory: curated
    url: https://simonwillison.net/atom/everything/
    feed_type: atom
    interval_seconds: 3600
    enabled: true
  - name: sebastian-raschka
    category: ai
    subcategory: curated
    url: https://magazine.sebastianraschka.com/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  - name: import-ai
    category: ai
    subcategory: curated
    url: https://importai.substack.com/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  - name: latent-space
    category: ai
    subcategory: curated
    url: https://www.latent.space/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  # The Batch publishes weekly via email — no public RSS. We subscribe with a
  # kill-the-newsletter.com inbox that converts incoming mails to an Atom feed.
  # Inbox email (for re-subscribe / unsubscribe via deeplearning.ai's manage page):
  #   do4ukfzxynw862ny6i40@kill-the-newsletter.com
  # Subscription registered 2026-04-20 with profile: Sven Pöche / Germany /
  # Software Engineer - Machine Learning. Items arrive ~weekly (Wed evenings).
  - name: the-batch
    category: ai
    subcategory: curated
    url: https://kill-the-newsletter.com/feeds/do4ukfzxynw862ny6i40.xml
    feed_type: atom
    interval_seconds: 21600
    enabled: true

  # Tier 3: Community
  - name: hackernews-ai
    category: ai
    subcategory: community
    url: http://hn.algolia.com/api/v1/search_by_date?query=AI+OR+LLM+OR+Claude&tags=story&numericFilters=points>100
    feed_type: json
    interval_seconds: 1800
    enabled: true
  - name: reddit-localllama
    category: ai
    subcategory: community
    url: https://www.reddit.com/r/LocalLLaMA/.rss
    feed_type: rss
    interval_seconds: 7200
    enabled: true

  # Claude Code
  - name: claude-code-releases
    category: ai
    subcategory: claude-code
    url: https://api.github.com/repos/anthropics/claude-code/releases
    feed_type: json
    interval_seconds: 43200
    enabled: true

  # Phase 2a — Weltgeschehen
  # Note: tagesschau-eilmeldungen (subcategory=breaking) was verified dead in
  # Task 1 (HTTP 404 on https://www.tagesschau.de/eilmeldungen/index~rss2.xml).
  # The `breaking` subcategory is reserved in NOTIFICATION_THRESHOLDS but unused
  # until a fetcher-level Eilmeldung-prefix heuristic on tagesschau-news lands
  # as a follow-up commit (spec §3.3 variant 1).

  # ─── news (3) ───────────────────────────────────
  - name: tagesschau-news
    category: world
    subcategory: news
    url: https://www.tagesschau.de/index~rss2.xml
    feed_type: rss
    interval_seconds: 1800
    enabled: true
  - name: bbc-world
    category: world
    subcategory: news
    url: http://feeds.bbci.co.uk/news/world/rss.xml
    feed_type: rss
    interval_seconds: 3600
    enabled: true
  - name: reuters-world
    category: world
    subcategory: news
    url: https://openrss.org/www.reuters.com/world/
    feed_type: rss
    interval_seconds: 3600
    enabled: true

  # ─── analysis (2) ───────────────────────────────
  - name: zeit-politik
    category: world
    subcategory: analysis
    url: https://newsfeed.zeit.de/politik/index
    feed_type: rss
    interval_seconds: 7200
    enabled: true
  - name: politico-eu
    category: world
    subcategory: analysis
    url: https://www.politico.eu/feed/
    feed_type: rss
    interval_seconds: 7200
    enabled: true
