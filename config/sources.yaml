sources:
  # Tier 1: arXiv (daily)
  - name: arxiv-cs-cl
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.CL
    feed_type: rss
    interval_seconds: 86400
    enabled: true
  - name: arxiv-cs-lg
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.LG
    feed_type: rss
    interval_seconds: 86400
    enabled: true
  - name: arxiv-cs-ai
    category: ai
    subcategory: arxiv
    url: https://arxiv.org/rss/cs.AI
    feed_type: rss
    interval_seconds: 86400
    enabled: true

  # Tier 1: Lab blogs
  # Anthropic has no public RSS; we discover articles via their sitemap.xml
  # (1587 entries with real per-article <lastmod>) and scrape og:title/description
  # per new URL. Same strategy for engineering + research subpaths.
  - name: anthropic-news
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/news/[^/]+$'
  - name: anthropic-engineering
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/engineering/[^/]+$'
  - name: anthropic-research
    category: ai
    subcategory: lab
    url: https://www.anthropic.com/sitemap.xml
    feed_type: sitemap-scrape
    interval_seconds: 3600
    enabled: true
    url_filter: '^/research/[^/]+$'
  - name: openai-blog
    category: ai
    subcategory: lab
    url: https://openai.com/news/rss.xml
    feed_type: rss
    interval_seconds: 3600
    enabled: true
  - name: deepmind-blog
    category: ai
    subcategory: lab
    url: https://deepmind.google/blog/rss.xml
    feed_type: rss
    interval_seconds: 3600
    enabled: true
  # Meta AI blog has no RSS, no sitemap (ai.meta.com/sitemap.xml returns 404),
  # and the blog index is a pure JS SPA with no static article links.
  # Scraping would require a headless browser — Phase-1 scope violation.
  - name: meta-ai-blog
    category: ai
    subcategory: lab
    url: https://ai.meta.com/blog/rss/
    feed_type: rss
    interval_seconds: 7200
    enabled: false
  - name: huggingface-blog
    category: ai
    subcategory: lab
    url: https://huggingface.co/blog/feed.xml
    feed_type: rss
    interval_seconds: 7200
    enabled: true

  # Tier 2: Curated
  - name: simon-willison
    category: ai
    subcategory: curated
    url: https://simonwillison.net/atom/everything/
    feed_type: atom
    interval_seconds: 3600
    enabled: true
  - name: sebastian-raschka
    category: ai
    subcategory: curated
    url: https://magazine.sebastianraschka.com/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  - name: import-ai
    category: ai
    subcategory: curated
    url: https://importai.substack.com/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  - name: latent-space
    category: ai
    subcategory: curated
    url: https://www.latent.space/feed
    feed_type: rss
    interval_seconds: 21600
    enabled: true
  # The Batch has no RSS; sitemap-0.xml has ~800 URLs but <lastmod> is the daily
  # site-build time (not article dates). We trust og:article:published_time per
  # URL instead — see the variety-heuristic fallback in parse_sitemap_scrape.
  - name: the-batch
    category: ai
    subcategory: curated
    url: https://www.deeplearning.ai/sitemap-0.xml
    feed_type: sitemap-scrape
    interval_seconds: 43200
    enabled: true
    url_filter: '^/the-batch/[^/]+/$'

  # Tier 3: Community
  - name: hackernews-ai
    category: ai
    subcategory: community
    url: http://hn.algolia.com/api/v1/search_by_date?query=AI+OR+LLM+OR+Claude&tags=story&numericFilters=points>100
    feed_type: json
    interval_seconds: 1800
    enabled: true
  - name: reddit-localllama
    category: ai
    subcategory: community
    url: https://www.reddit.com/r/LocalLLaMA/.rss
    feed_type: rss
    interval_seconds: 7200
    enabled: true

  # Claude Code
  - name: claude-code-releases
    category: ai
    subcategory: claude-code
    url: https://api.github.com/repos/anthropics/claude-code/releases
    feed_type: json
    interval_seconds: 43200
    enabled: true
